<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="container">

        <div class="imagem">
            <img src="img/login.jpg" alt="login">
        </div>
        <h1>Bem-vindo!</h1>
        <p>Entre para continuar</p>

        <form>
         <div class="form-control">
            <label for="login">Login</label>
            <input type="text" id="login" placeholder="Digite seu login">
         </div>

          <div class="form-control">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">
         </div>

          <div class="form-control">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
         </div>

         <div class="form-control">
            <div class="opcoes">
                <input type="checkbox" id="lembrar"/>
                <label for="lembrar">Lembrar meu login</label>
            </div>
         </div>

            <div class="form-control">
                <label>Tipo de acesso</label>

                <div class="opcoes">
                <input type="radio" id="aluno" name="tipo" value="aluno"/>
                <label for="aluno">Aluno</label>

                 <input type="radio" id="professor" name="tipo" value="professor"/>
                <label for="professor">Professor</label>
                </div>
            </div>

            <div class="form-control">
                <label for="cidade">Cidade</label>

                <select id="cidade">
                    <option value="">Selecione sua cidade</option>
                    <option value="jundiai">Jundiaí</option>
                    <option value="sao-paulo">São Paulo</option>
                    <option value="cotia">Cotia</option>
                    <option value="cotia">Santos</option>
                    <option value="cotia">Campinas</option>
                </select>
            
                <div class="form-control">
                    <button type="submit">Entrar</button>
                </div>
            </div>
        </form>

          <a href="recuperar.html">Esqueci minha senha</a>
    </div>
    
  
    
    
</body>
</html>
